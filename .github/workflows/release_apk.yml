name: Build and publish signed APK

# Pushing a `v*` tag builds a release APK signed with the stable key stored in
# `app/keystore/` and publishes it to GitHub Releases with a SHA-256 checksum.
# A new build always installs over an already installed one because the signing
# key never changes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble release APK
        run: ./gradlew app:assembleRelease

      - name: Name and checksum the APK
        run: |
          cd app/build/outputs/apk/release

          if [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_NAME}" != "${GITHUB_REF_NAME#v}" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(date -u +%Y%m%d-%H%M)"
          fi

          mv app-release.apk "magnet-search-${tag}.apk"
          sha256sum "magnet-search-${tag}.apk" > SHA256_CHECKSUM.txt
          cat SHA256_CHECKSUM.txt

          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "APK_NAME=magnet-search-${tag}.apk" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built by GitHub Actions from commit ${GITHUB_SHA}.
          Signed with the stable key in app/keystore (alias magnetsearch).
          Verify with: sha256sum -c SHA256_CHECKSUM.txt"

          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Magnet Search $RELEASE_TAG" \
            --notes "$notes" \
            "app/build/outputs/apk/release/${APK_NAME}" \
            app/build/outputs/apk/release/SHA256_CHECKSUM.txt
