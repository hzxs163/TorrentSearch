name: Build debug APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'fastlane/*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Assemle debug APK with gradlew
      run: |
        set -o pipefail
        ./gradlew app:assembleDebug --console=plain 2>&1 | tee "$RUNNER_TEMP/debug-build.log"

    - name: Publish build errors on the commit
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        log="$RUNNER_TEMP/debug-build.log"

        if [ ! -f "$log" ]; then
          body="Debug build failed before the gradle step produced a log."
        else
          errors=$(grep -E "^e: |^> Task .*FAILED|What went wrong|Unresolved reference|error:|FAILURE" \
            "$log" | head -c 4000)
          tail_lines=$(tail -c 3000 "$log")
          head_lines=$(head -c 1200 "$log")

          body="Debug build failed on this commit (log size: $(wc -c < "$log") bytes).

        ### matched errors
        \`\`\`
        ${errors:-none matched}
        \`\`\`

        ### log start
        \`\`\`
        ${head_lines}
        \`\`\`

        ### log end
        \`\`\`
        ${tail_lines}
        \`\`\`"
        fi

        gh api --method POST \
          "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
          -f body="$body"

    - name: Rename APK file to torrentsearch-debug.apk
      run: |
        cd app/build/outputs/apk/debug
        mv app-debug.apk torrentsearch-debug.apk

    - name: Upload debug APK
      uses: actions/upload-artifact@v7.0.1
      with:
        path: app/build/outputs/apk/debug/torrentsearch-debug.apk
        archive: false
